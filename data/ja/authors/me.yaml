role: 法政大学大学院 情報科学研究科 情報科学専攻 修士課程2年

bio: |
  法政大学大学院 情報科学研究科 Computational Reality Laboratory 所属。
  専用の眼鏡を使わずに立体映像を見られる、パララックスバリア方式の裸眼3Dディスプレイを研究しています。
  バリアとディスプレイパネルの貼り合わせ時に生じる回転ズレを撮影したモアレから推定し、
  視差画像を補正することで、精密な位置合わせに頼らずに安定した立体視を実現することを目指しています。

