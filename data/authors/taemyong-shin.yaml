# ═══════════════════════════════════════════════════════════════════════
# 国際会議の発表で筆頭著者を英語表記にするためのプロフィール
#   `me` を使うと，日本語版サイトでは data/ja/authors/me.yaml が優先され
#   「申 泰明」と表示されてしまう。原著が英語の発表では著者名も原著どおり
#   英語で出したいため，日本語版の上書きを持たないこのプロフィールを使う。
#   （data/ja/authors/ に同名ファイルを作らないこと）
# ═══════════════════════════════════════════════════════════════════════
schema: hugoblox/author/v1
slug: taemyong-shin

name:
  display: Taemyong Shin
  given: Taemyong
  family: Shin
