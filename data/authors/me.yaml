bio: |
  Taemyong Shin is a master's student at the Computational Reality Laboratory,
  Hosei University. He works on parallax-barrier autostereoscopic 3D displays,
  focusing on the rotational misalignment that occurs when the barrier is
  bonded to the display panel. He develops methods that estimate the
  misalignment angle from captured moiré patterns and correct the parallax
  images accordingly, so that glasses-free stereoscopy stays stable without
  precise mechanical alignment.

